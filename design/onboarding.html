<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tapas onboarding — design</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --plaster: #f3eadc;
      --walnut: #3a271c;
      --card: #4a3224;
      --cream: #f7efe3;
      --saffron: #e39a3c;
      --ink: #2b1c14;
      --mute: rgba(247, 239, 227, 0.62);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: "Source Sans 3", system-ui, sans-serif;
      background: #1c1612;
      color: var(--cream);
      display: grid;
      grid-template-columns: 220px 1fr;
      min-height: 100%;
    }
    aside {
      padding: 28px 22px;
      border-right: 1px solid rgba(247, 239, 227, 0.08);
      background: #161210;
    }
    aside h1 {
      font-family: Fraunces, serif;
      font-size: 18px;
      font-weight: 600;
      margin: 0 0 6px;
    }
    aside p {
      color: var(--mute);
      font-size: 13px;
      line-height: 1.45;
      margin: 0 0 22px;
    }
    aside button {
      display: block;
      width: 100%;
      text-align: left;
      background: transparent;
      color: var(--cream);
      border: 0;
      border-radius: 8px;
      padding: 8px 10px;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }
    aside button[aria-current="true"] {
      background: var(--card);
      color: var(--saffron);
    }
    main {
      display: grid;
      place-items: start center;
      padding: 48px 24px 80px;
      background:
        radial-gradient(1200px 500px at 50% -10%, #3a2a20, transparent 55%),
        #241c16;
    }
    .laptop {
      width: min(920px, 100%);
    }
    .bezel {
      background: #0b0b0b;
      border-radius: 18px 18px 0 0;
      height: 28px;
      position: relative;
    }
    .notch {
      position: absolute;
      left: 50%;
      top: 0;
      transform: translateX(-50%);
      width: 128px;
      height: 18px;
      background: #050505;
      border-radius: 0 0 10px 10px;
    }
    .screen {
      background: var(--plaster);
      min-height: 520px;
      position: relative;
      overflow: hidden;
      color: var(--ink);
    }
    .screen::before {
      content: "Safari";
      position: absolute;
      top: 18px;
      left: 24px;
      font-size: 12px;
      color: rgba(43, 28, 20, 0.35);
    }
    .hang {
      position: absolute;
      left: 50%;
      top: 0;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      width: min(420px, calc(100% - 32px));
    }
    .neck {
      width: 42px;
      height: 22px;
      background: var(--walnut);
      border-radius: 0 0 8px 8px;
    }
    .card {
      width: 100%;
      background: var(--card);
      color: var(--cream);
      border-radius: 18px;
      padding: 16px 18px 18px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.28);
      border: 1px solid rgba(227, 154, 60, 0.28);
    }
    .row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .plate {
      width: 22px;
      height: 14px;
      border: 1.6px solid var(--saffron);
      border-radius: 50%;
      position: relative;
      flex: 0 0 auto;
    }
    .plate::after {
      content: "";
      position: absolute;
      inset: 3px 5px;
      border: 1.2px solid rgba(227, 154, 60, 0.8);
      border-radius: 50%;
    }
    h2 {
      font-family: Fraunces, serif;
      font-size: 22px;
      font-weight: 600;
      margin: 0;
    }
    .skip {
      margin-left: auto;
      color: rgba(247, 239, 227, 0.32);
      font-size: 12px;
      background: none;
      border: 0;
      cursor: pointer;
    }
    .copy {
      margin: 12px 0 0;
      font-size: 14px;
      line-height: 1.45;
      color: rgba(247, 239, 227, 0.84);
      white-space: pre-line;
    }
    .actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 16px;
    }
    .primary {
      background: var(--saffron);
      color: var(--walnut);
      border: 0;
      border-radius: 999px;
      padding: 8px 14px;
      font: inherit;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }
    .talk {
      width: 100%;
      margin-top: 12px;
      border: 0;
      border-radius: 999px;
      padding: 10px;
      font: inherit;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      background: var(--walnut);
      color: var(--cream);
    }
    .talk.live {
      background: var(--saffron);
      color: var(--walnut);
    }
    .field {
      margin-top: 12px;
      min-height: 72px;
      border-radius: 10px;
      background: rgba(43, 28, 20, 0.45);
      border: 1px solid rgba(227, 154, 60, 0.28);
      padding: 10px 12px;
      color: var(--cream);
      font-size: 14px;
    }
    .field span { color: rgba(247, 239, 227, 0.35); }
    .kitchen {
      height: 52px;
      margin-top: 10px;
    }
    .bar {
      height: 4px;
      background: rgba(247, 239, 227, 0.12);
      border-radius: 99px;
      overflow: hidden;
      margin-top: 8px;
    }
    .bar i {
      display: block;
      height: 100%;
      width: 62%;
      background: var(--saffron);
    }
    .hint {
      margin-top: 28px;
      color: rgba(247, 239, 227, 0.4);
      font-size: 12px;
      text-align: center;
    }
  </style>
</head>
<body>
  <aside>
    <h1>Tapas</h1>
    <p>Design sandbox. Click a step. This is not the app. We freeze look here before touching Swift again.</p>
    <button data-step="intro" aria-current="true">1. Intro</button>
    <button data-step="mic">2. Microphone</button>
    <button data-step="kitchen">3. Kitchen</button>
    <button data-step="try">4. Try it</button>
  </aside>
  <main>
    <div class="laptop">
      <div class="bezel"><div class="notch"></div></div>
      <div class="screen">
        <div class="hang">
          <div class="neck"></div>
          <div class="card" id="card"></div>
        </div>
      </div>
    </div>
    <p class="hint">Walnut card, saffron plate, hanging from the camera. No mascot. No black slab.</p>
  </main>
  <script>
    const steps = {
      intro: `
        <div class="row">
          <div class="plate"></div>
          <h2>Tapas</h2>
          <button class="skip">Skip</button>
        </div>
        <p class="copy">A plate of small tools on this Mac. Not a chat, not a cloud.

First dish is Dictado. You talk, it types where you are. Nothing leaves the machine. Notes land in Documents, so the tools you already use can read them.</p>
        <div class="actions"><button class="primary" data-next="mic">Show me</button></div>`,
      mic: `
        <div class="row">
          <div class="plate"></div>
          <div>I need the mic.</div>
          <button class="primary" data-next="kitchen">Allow</button>
          <button class="skip">Skip</button>
        </div>`,
      kitchen: `
        <div class="row">
          <div class="plate"></div>
          <div>Hiring the kitchen.</div>
          <button class="skip">Skip</button>
        </div>
        <svg class="kitchen" viewBox="0 0 320 52" fill="none" stroke="#e39a3c" stroke-width="1.7" stroke-linecap="round">
          <ellipse cx="40" cy="34" rx="28" ry="9"/>
          <path d="M66 34h16"/>
          <path d="M32 24c-2-8 6-12 2-18" stroke="#f7efe3" stroke-opacity=".55"/>
          <path d="M48 22c0-8 8-10 4-16" stroke="#f7efe3" stroke-opacity=".55"/>
          <ellipse cx="120" cy="32" rx="11" ry="5"/>
          <ellipse cx="152" cy="32" rx="11" ry="5" stroke-opacity=".85"/>
          <ellipse cx="184" cy="32" rx="11" ry="5" stroke-opacity=".35"/>
        </svg>
        <div class="bar"><i></i></div>`,
      try: `
        <div class="row">
          <div class="plate"></div>
          <div>⌃⌥. Talk.</div>
          <button class="skip">Skip</button>
        </div>
        <div class="field" id="field"><span>Talk.</span></div>
        <button class="talk" id="talk">Click to talk</button>`
    };

    const card = document.getElementById("card");
    const buttons = [...document.querySelectorAll("aside button")];

    function show(step) {
      card.innerHTML = steps[step];
      buttons.forEach((b) => b.setAttribute("aria-current", b.dataset.step === step ? "true" : "false"));
      card.querySelector("[data-next]")?.addEventListener("click", (e) => show(e.target.dataset.next));
      const talk = card.querySelector("#talk");
      if (talk) {
        talk.addEventListener("click", () => {
          const on = talk.classList.toggle("live");
          talk.textContent = on ? "Listening…" : "Click to talk";
          const field = card.querySelector("#field");
          field.innerHTML = on
            ? "A plate of small tools on this Mac."
            : "<span>Talk.</span>";
        });
      }
    }

    buttons.forEach((b) => b.addEventListener("click", () => show(b.dataset.step)));
    show("intro");
  </script>
</body>
</html>
